<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mode Architecture & Export Tests</title></head>
<body>
<div id="results">Running tests...</div>
<canvas id="gl-canvas" width="800" height="600"></canvas>
<div id="ui-container">
  <div id="controls-bar">
    <button id="btn-mode-reference" class="active"></button>
    <button id="btn-mode-explore"></button>
    <button id="btn-randomize-action"></button>
    <button id="btn-randomize-toggle"></button>
    <button id="btn-palette-toggle"></button>
    <button id="btn-zoom-in"></button>
    <button id="btn-zoom-out"></button>
    <button id="btn-pause"></button>
    <button id="btn-reset"></button>
    <button class="sym-btn" data-n="16"></button>
    <button class="sym-btn" data-n="24"></button>
    <button class="palette-select-btn" data-pal="cobalt"></button>
    <button class="palette-select-btn" data-pal="amethyst"></button>
  </div>
  <div id="mode-status-pill"></div>
  <div id="randomize-menu"></div>
  <div id="palette-menu"></div>
  <div id="equation-readout"></div>
  <span id="val-a"></span><span id="val-b"></span><span id="val-c"></span><span id="val-d"></span><span id="val-n"></span>
  <div id="coeff-drawer">
    <input type="range" class="coeff-slider" id="slider-a-re" value="0">
    <span class="coeff-val" id="lbl-a-re">0.00</span>
    <input type="range" class="coeff-slider" id="slider-b-im" value="0">
    <span class="coeff-val" id="lbl-b-im">0.00</span>
    <input type="range" class="coeff-slider" id="slider-c-re" value="0">
    <span class="coeff-val" id="lbl-c-re">0.00</span>
    <input type="range" class="coeff-slider" id="slider-d-im" value="0">
    <span class="coeff-val" id="lbl-d-im">0.00</span>
    <button id="btn-reset-coeffs"></button>
  </div>
  <div id="coeff-lock-notice"></div>
  <div id="export-modal"></div>
  <div id="preset-modal"></div>
  <div id="toast-banner"></div>
  <span id="export-status-label"></span>
  <span id="export-status-pct"></span>
  <div id="export-progress-fill"></div>
  <button id="btn-export-start"></button>
  <button id="btn-export-cancel"></button>
  <div id="export-progress-area"></div>
</div>

<script>
  window.onerror = function(msg, url, line, col, err) {
    fetch('/test_report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([{ name: 'Runtime Error', passed: false, details: `${msg} at ${line}:${col} 
${err ? err.stack : ''}` }])
    });
  };
  window.addEventListener('unhandledrejection', function(e) {
    fetch('/test_report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([{ name: 'Unhandled Rejection', passed: false, details: String(e.reason ? e.reason.stack || e.reason : 'unknown') }])
    });
  });
</script>
<script type="module" src="./app.js"></script>
<script type="module">
import { MathSystem, CONRADI_REFERENCE } from './math.js';
import { MobiusRenderer, PALETTES } from './renderer.js';
import { CURATED_PRESETS, App } from './app.js';

async function runTests() {
  const tests = [];
  
  // Wait for window.app to initialize
  await new Promise(r => setTimeout(r, 200));
  let app = window.app || window.__app;
  if (!app) {
    app = new App();
    window.app = app;
  }
  const renderer = app.renderer;
  const math = app.math;

  // =========================================================================
  // TEST GROUP 1: REFERENCE MODE VERIFICATION
  // =========================================================================
  // 1.1 Activate Reference mode
  app.setMode('reference');

  const refPass = (
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    Math.abs(math.a.i - (0.330)) < 1e-4 &&
    Math.abs(math.b.r - (-0.376)) < 1e-4 &&
    Math.abs(math.b.i - (0.026)) < 1e-4 &&
    Math.abs(math.c.r - (6.401)) < 1e-4 &&
    Math.abs(math.c.i - (0.803)) < 1e-4 &&
    Math.abs(math.d.r - (1.520)) < 1e-4 &&
    Math.abs(math.d.i - (0.840)) < 1e-4 &&
    math.evolving === false &&
    renderer.zoom === 1.65 &&
    renderer.viewCenter[0] === 0.0 && renderer.viewCenter[1] === 0.0
  );
  tests.push({
    name: "Reference Mode: Exact Conradi Parameters & Framing",
    passed: refPass,
    details: `n=${math.n}, a=${math.a.format()}, b=${math.b.format()}, c=${math.c.format()}, d=${math.d.format()}, zoom=${renderer.zoom}, evolving=${math.evolving}`
  });

  // 1.2 Mouse movement must NOT alter formula in Reference mode
  const aBeforePert = math.a.clone();
  math.setPointer(0.75, -0.75);
  math.update(0.1, 1.65);
  const aAfterPert = math.a.clone();
  const pertDiff = Math.hypot(aAfterPert.r - aBeforePert.r, aAfterPert.i - aBeforePert.i);
  tests.push({
    name: "Reference Mode: Mouse Movement Invariant (Does NOT alter formula)",
    passed: pertDiff === 0.0,
    details: `Perturbation diff in Reference mode: ${pertDiff}`
  });

  // 1.3 Click shock must NOT alter formula in Reference mode
  const cBeforeShock = math.c.clone();
  math.injectShock(1.0, 0.0);
  math.update(0.016, 1.65);
  const cAfterShock = math.c.clone();
  const shockDiff = Math.hypot(cAfterShock.r - cBeforeShock.r, cAfterShock.i - cBeforeShock.i);
  tests.push({
    name: "Reference Mode: Click Shock Invariant (Does NOT alter formula)",
    passed: shockDiff === 0.0,
    details: `Shock diff in Reference mode: ${shockDiff}`
  });

  // 1.4 User offset must NOT alter formula in Reference mode
  math.setCoefficientOffset('a', 0.5, 0.5);
  math.update(0.016, 1.65);
  tests.push({
    name: "Reference Mode: Coefficient Offsets Invariant",
    passed: math.userOffsetA.r === 0 && math.a.r === -0.755,
    details: `Offset A: ${math.userOffsetA.format()}, a: ${math.a.format()}`
  });

  // 1.5 Drift must be paused in Reference mode
  const t0 = math.time;
  math.update(0.5, 1.65);
  tests.push({
    name: "Reference Mode: Autonomous Drift Paused",
    passed: math.evolving === false && math.time === t0,
    details: `Evolving: ${math.evolving}, time delta: ${math.time - t0}`
  });

  // 1.6 Reference Mode Framing preservation
  const preZoom = renderer.targetZoom;
  document.getElementById('btn-zoom-in').click();
  const postZoom = renderer.targetZoom;
  tests.push({
    name: "Reference Mode: Camera Framing Locked Against Zoom Buttons",
    passed: preZoom === postZoom && app.mode === 'reference',
    details: `Pre-zoom: ${preZoom}, post-zoom: ${postZoom}, mode: ${app.mode}`
  });

  // 1.7 Clicking n=16 in Reference mode keeps mode as 'reference'
  document.querySelector('.sym-btn[data-n="16"]').click();
  tests.push({
    name: "Reference Mode: Selecting n=16 Does Not Kick Out to Explore",
    passed: app.mode === 'reference' && math.n === 16,
    details: `Mode: ${app.mode}, n: ${math.n}`
  });

  // =========================================================================
  // TEST GROUP 2: EXPLORE MODE VERIFICATION
  // =========================================================================
  app.setMode('explore');
  const exploreInitialA = math.a.clone();
  math.setPointer(0.6, -0.4);
  math.update(0.1, 1.65);
  const explorePertA = math.a.clone();
  const explorePertDiff = Math.hypot(explorePertA.r - exploreInitialA.r, explorePertA.i - exploreInitialA.i);
  tests.push({
    name: "Explore Mode: Pointer Perturbation Active",
    passed: explorePertDiff > 0.001,
    details: `Delta a in Explore mode: ${explorePertDiff.toFixed(5)}`
  });

  // Shock in explore mode
  const explorePreShockC = math.c.clone();
  math.injectShock(1.0, 0.0);
  math.update(0.016, 1.65);
  const explorePostShockC = math.c.clone();
  const exploreShockDiff = Math.hypot(explorePostShockC.r - explorePreShockC.r, explorePostShockC.i - explorePreShockC.i);
  tests.push({
    name: "Explore Mode: Click Shock Active",
    passed: exploreShockDiff > 0.05,
    details: `Delta c on shock: ${exploreShockDiff.toFixed(5)}`
  });

  // Slider editing in explore mode
  math.setCoefficientOffset('b', 0.12, -0.08);
  math.update(0.016, 1.65);
  tests.push({
    name: "Explore Mode: Coefficient Slider Offsets Active",
    passed: Math.abs(math.userOffsetB.i - (-0.08)) < 1e-4,
    details: `userOffsetB: ${math.userOffsetB.format()}`
  });

  // =========================================================================
  // TEST GROUP 3: CURATED RANDOMIZATION STYLES & 1-CLICK RANDOMIZE
  // =========================================================================
  const styles = ['subtle', 'organic', 'dense lace', 'symmetric', 'chaotic', 'conradi-like'];
  for (const st of styles) {
    const res = math.randomize(st);
    const valid = (
      res.style.toLowerCase() === st.toLowerCase() &&
      Number.isInteger(res.n) && res.n >= 3 &&
      !isNaN(math.a.r) && !isNaN(math.a.i) &&
      !isNaN(math.c.r) && !isNaN(math.c.i) &&
      math.mode === 'explore'
    );
    tests.push({
      name: `Randomize Style: [${st}]`,
      passed: valid,
      details: `${res.name} (n=${res.n}, a=${res.a})`
    });
  }

  // Quick Randomize without arguments
  const quickRes = math.randomize();
  tests.push({
    name: "Quick Randomize Without Arguments: Aesthetically Curated",
    passed: quickRes && styles.includes(quickRes.style) && Number.isInteger(quickRes.n),
    details: `Selected style: [${quickRes.style}] (${quickRes.name})`
  });

  // =========================================================================
  // TEST GROUP 4: PRESET SERIALIZATION & CURATED PRESETS RESTORATION
  // =========================================================================
  // 4.1 Curated Preset loading: Filament Storm (24-fold)
  const stormPreset = CURATED_PRESETS.find(p => p.name.includes('Filament Storm'));
  app.loadPresetObject(stormPreset);
  const stormPass = (
    math.n === 24 &&
    math.evolving === true &&
    app.mode === 'explore' &&
    renderer.activePalette === 'amethyst'
  );
  tests.push({
    name: "Curated Preset Load: Filament Storm (n=24, drift=true, palette=amethyst)",
    passed: stormPass,
    details: `n=${math.n}, evolving=${math.evolving}, mode=${app.mode}, palette=${renderer.activePalette}`
  });

  // 4.2 Curated Preset loading: Organic Knot (8-fold)
  const knotPreset = CURATED_PRESETS.find(p => p.name.includes('Organic Knot'));
  app.loadPresetObject(knotPreset);
  const knotPass = (
    math.n === 8 &&
    math.evolving === true &&
    renderer.activePalette === 'aurora'
  );
  tests.push({
    name: "Curated Preset Load: Organic Knot (n=8, palette=aurora)",
    passed: knotPass,
    details: `n=${math.n}, palette=${renderer.activePalette}`
  });

  // 4.3 User Preset Round-trip Serialization
  app.setMode('explore');
  math.setSymmetry(20);
  math.setCoefficientOffset('a', 0.25, 0.0);
  renderer.setPalette('solar');
  const userPresetObj = app.getPresetObject('My Custom Test Preset');
  
  // Mutate away
  app.setMode('reference');
  
  // Restore user preset
  app.loadPresetObject(userPresetObj);
  const userPresetRestored = (
    math.n === 20 &&
    math.mode === 'explore' &&
    Math.abs(math.userOffsetA.r - 0.25) < 1e-4 &&
    renderer.activePalette === 'solar' &&
    document.getElementById('lbl-a-re').innerText === '0.25'
  );
  tests.push({
    name: "User Preset Round-trip: Parameter, Offsets & Slider Sync",
    passed: userPresetRestored,
    details: `n=${math.n}, userOffsetA=${math.userOffsetA.format()}, slider lbl=${document.getElementById('lbl-a-re').innerText}`
  });

  // =========================================================================
  // TEST GROUP 4.B: ISSUE 1 — REFERENCE MODE INVARIANT REGRESSION TESTS
  // =========================================================================

  // 1. Normal Reference preset loads canonical math
  const normalRefPreset = CURATED_PRESETS.find(p => p.mode === 'reference') || { mode: 'reference' };
  app.loadPresetObject(normalRefPreset);
  const test1Pass = (
    app.mode === 'reference' &&
    math.mode === 'reference' &&
    math.n === 16 &&
    math.omegas.length === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    Math.abs(math.a.i - 0.330) < 1e-4 &&
    Math.abs(math.b.r - (-0.376)) < 1e-4 &&
    Math.abs(math.b.i - 0.026) < 1e-4 &&
    Math.abs(math.c.r - 6.401) < 1e-4 &&
    Math.abs(math.c.i - 0.803) < 1e-4 &&
    Math.abs(math.d.r - 1.520) < 1e-4 &&
    Math.abs(math.d.i - 0.840) < 1e-4 &&
    math.userOffsetA.r === 0 && math.userOffsetA.i === 0 &&
    math.evolving === false && math.time === 0 &&
    math.pointerPerturbationEnabled === false && math.shockEnabled === false &&
    renderer.zoom === 1.65 && renderer.activePalette === 'cobalt' &&
    document.getElementById('lbl-a-re').innerText === '0.00' &&
    document.getElementById('val-n').innerText === '16'
  );
  tests.push({
    name: "Regression 1: Normal Reference preset loads canonical math",
    passed: test1Pass,
    details: `mode=${app.mode}, n=${math.n}, a=${math.a.format()}, offsets=${math.userOffsetA.format()}, evolving=${math.evolving}`
  });

  // 2. Malicious Reference preset with n=32 still results in n=16 (Adversarial Case B variant)
  app.loadPresetObject({ mode: 'reference', symmetry: 32 });
  const test2Pass = (
    app.mode === 'reference' &&
    math.mode === 'reference' &&
    math.n === 16 &&
    math.omegas.length === 16 &&
    document.getElementById('val-n').innerText === '16'
  );
  tests.push({
    name: "Regression 2: Malicious Reference preset with n=32 still results in n=16",
    passed: test2Pass,
    details: `math.n=${math.n}, omegas.length=${math.omegas.length}, readout=${document.getElementById('val-n').innerText}`
  });

  // 3. Malicious Reference preset with fake coefficients still results in canonical coefficients (Adversarial Case A)
  app.loadPresetObject({
    mode: "reference",
    symmetry: 32,
    coefficients: {
      a: { r: 5, i: 5 },
      b: { r: 6, i: 6 },
      c: { r: 7, i: 7 },
      d: { r: 8, i: 8 }
    }
  });
  const test3Pass = (
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    Math.abs(math.a.i - 0.330) < 1e-4 &&
    Math.abs(math.b.r - (-0.376)) < 1e-4 &&
    Math.abs(math.b.i - 0.026) < 1e-4 &&
    Math.abs(math.c.r - 6.401) < 1e-4 &&
    Math.abs(math.c.i - 0.803) < 1e-4 &&
    Math.abs(math.d.r - 1.520) < 1e-4 &&
    Math.abs(math.d.i - 0.840) < 1e-4 &&
    document.getElementById('val-a').innerText.includes('-0.755')
  );
  tests.push({
    name: "Regression 3: Malicious Reference preset with fake coefficients results in canonical coefficients",
    passed: test3Pass,
    details: `math.a=${math.a.format()}, math.b=${math.b.format()}, math.c=${math.c.format()}, math.d=${math.d.format()}`
  });

  // 4. Reference preset with nonzero user offsets results in zero offsets
  app.loadPresetObject({
    mode: "reference",
    userOffsets: {
      a: { r: 1.25, i: -0.85 },
      b: { r: 0.5, i: 0.5 },
      c: { r: -2.0, i: 3.0 },
      d: { r: 1.0, i: -1.0 }
    }
  });
  const test4Pass = (
    math.userOffsetA.r === 0 && math.userOffsetA.i === 0 &&
    math.userOffsetB.r === 0 && math.userOffsetB.i === 0 &&
    math.userOffsetC.r === 0 && math.userOffsetC.i === 0 &&
    math.userOffsetD.r === 0 && math.userOffsetD.i === 0 &&
    document.getElementById('lbl-a-re').innerText === '0.00' &&
    document.getElementById('lbl-b-im').innerText === '0.00'
  );
  tests.push({
    name: "Regression 4: Reference preset with nonzero user offsets results in zero offsets",
    passed: test4Pass,
    details: `offsetA=${math.userOffsetA.format()}, lbl-a-re=${document.getElementById('lbl-a-re').innerText}`
  });

  // 5. Reference preset requesting drift=true results in drift=false
  app.loadPresetObject({
    mode: "reference",
    drift: { evolving: true, time: 999.0 }
  });
  const test5Pass = (
    math.evolving === false &&
    math.time === 0 &&
    document.getElementById('btn-pause').innerText === 'Drift: Off' &&
    document.getElementById('btn-pause').disabled === true
  );
  tests.push({
    name: "Regression 5: Reference preset requesting drift=true results in drift=false",
    passed: test5Pass,
    details: `evolving=${math.evolving}, time=${math.time}, btnPause text=${document.getElementById('btn-pause').innerText}`
  });

  // 6. Reference preset containing pointer/shock state cannot perturb formula
  app.loadPresetObject({
    mode: "reference",
    pointerTarget: { r: 0.8, i: 0.8 },
    pointerCurrent: { r: 0.8, i: 0.8 },
    shockMag: 1.0,
    shockPhase: 0.5
  });
  // Attempt perturbations while in reference mode
  math.setPointer(0.9, -0.9);
  math.injectShock(1.0, 1.0);
  math.update(0.1, 1.65);
  const test6Pass = (
    math.pointerTarget.r === 0 && math.pointerTarget.i === 0 &&
    math.pointerCurrent.r === 0 && math.pointerCurrent.i === 0 &&
    math.shockMag === 0 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    Math.abs(math.c.r - 6.401) < 1e-4
  );
  tests.push({
    name: "Regression 6: Reference preset containing pointer/shock state cannot perturb formula",
    passed: test6Pass,
    details: `ptrCurrent=${math.pointerCurrent.format()}, shockMag=${math.shockMag}, a=${math.a.format()}`
  });

  // 7. Explore presets still restore their custom parameters correctly
  const customExplorePreset = {
    name: "Explore Custom Preset Verification",
    mode: "explore",
    symmetry: 24,
    coefficients: {
      a: { r: -0.710, i: 0.420 },
      b: { r: -0.395, i: 0.010 },
      c: { r: 7.350, i: 0.650 },
      d: { r: 1.650, i: 0.820 }
    },
    userOffsets: {
      a: { r: 0.15, i: 0.05 },
      b: { r: 0, i: 0 },
      c: { r: 0, i: 0 },
      d: { r: 0, i: 0 }
    },
    drift: { evolving: true, time: 25.0 },
    palette: "amethyst"
  };
  app.loadPresetObject(customExplorePreset);
  const test7Pass = (
    app.mode === 'explore' &&
    math.mode === 'explore' &&
    math.n === 24 &&
    Math.abs(math.baseA.r - (-0.710)) < 1e-4 &&
    Math.abs(math.baseA.i - 0.420) < 1e-4 &&
    Math.abs(math.userOffsetA.r - 0.15) < 1e-4 &&
    math.evolving === true &&
    renderer.activePalette === 'amethyst' &&
    document.getElementById('lbl-a-re').innerText === '0.15'
  );
  tests.push({
    name: "Regression 7: Explore presets still restore custom parameters correctly",
    passed: test7Pass,
    details: `mode=${app.mode}, n=${math.n}, baseA=${math.baseA.format()}, offsetA=${math.userOffsetA.format()}, evolving=${math.evolving}, palette=${renderer.activePalette}`
  });

  // 8. Saved Explore -> load -> return Reference restores exact canonical math
  app.setMode('explore');
  math.setSymmetry(20);
  math.setCoefficientOffset('a', 0.30, 0.10);
  const savedExplore = app.getPresetObject('Temporary Explore Session');
  // Load saved explore
  app.loadPresetObject(savedExplore);
  const midPass = (app.mode === 'explore' && math.n === 20 && Math.abs(math.userOffsetA.r - 0.30) < 1e-4);
  // Return to Reference
  app.setMode('reference');
  const test8Pass = (
    midPass &&
    app.mode === 'reference' &&
    math.mode === 'reference' &&
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    Math.abs(math.a.i - 0.330) < 1e-4 &&
    Math.abs(math.b.r - (-0.376)) < 1e-4 &&
    Math.abs(math.b.i - 0.026) < 1e-4 &&
    Math.abs(math.c.r - 6.401) < 1e-4 &&
    Math.abs(math.c.i - 0.803) < 1e-4 &&
    Math.abs(math.d.r - 1.520) < 1e-4 &&
    Math.abs(math.d.i - 0.840) < 1e-4 &&
    math.userOffsetA.r === 0 && math.userOffsetA.i === 0 &&
    math.evolving === false && math.time === 0 &&
    renderer.zoom === 1.65 && renderer.activePalette === 'cobalt' &&
    document.getElementById('lbl-a-re').innerText === '0.00'
  );
  tests.push({
    name: "Regression 8: Saved Explore -> load -> return Reference restores exact canonical math",
    passed: test8Pass,
    details: `midPass=${midPass}, finalMode=${app.mode}, final_n=${math.n}, a=${math.a.format()}, offsets=${math.userOffsetA.format()}`
  });

  // 9. UI mode and MathSystem mode cannot disagree after preset loading (Adversarial A, B, C, D)
  // Adversarial Case B: symmetry: 3
  app.loadPresetObject({ mode: "reference", symmetry: 3 });
  const caseBPass = (app.mode === 'reference' && math.mode === 'reference' && math.n === 16);

  // Adversarial Case C: Explore preset with mode manually set to 'reference'
  const exploreWithRefMode = JSON.parse(JSON.stringify(stormPreset));
  exploreWithRefMode.mode = "reference";
  app.loadPresetObject(exploreWithRefMode);
  const caseCPass = (
    app.mode === 'reference' &&
    math.mode === 'reference' &&
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    renderer.activePalette === 'cobalt'
  );

  // Adversarial Case D: Saved Reference preset containing stale/modified coefficients
  const staleRefPreset = {
    name: "Stale Reference Preset",
    mode: "reference",
    symmetry: 28,
    coefficients: {
      a: { r: -0.999, i: 0.999 },
      b: { r: -0.999, i: 0.999 },
      c: { r: 9.999, i: 9.999 },
      d: { r: 9.999, i: 9.999 }
    },
    userOffsets: { a: { r: 0.5, i: 0.5 } },
    camera: { zoom: 12.0, center: [1.0, 1.0] },
    palette: "neon"
  };
  app.loadPresetObject(staleRefPreset);
  const caseDPass = (
    app.mode === 'reference' &&
    math.mode === 'reference' &&
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4 &&
    renderer.zoom === 1.65 &&
    renderer.activePalette === 'cobalt' &&
    document.getElementById('lbl-a-re').innerText === '0.00'
  );

  // MathSystem.fromJSON direct adversarial test
  math.fromJSON({ mode: 'reference', symmetry: 40, coefficients: { a: { r: 8, i: 8 } } });
  const directMathPass = (
    math.mode === 'reference' &&
    math.n === 16 &&
    Math.abs(math.a.r - (-0.755)) < 1e-4
  );

  const test9Pass = caseBPass && caseCPass && caseDPass && directMathPass &&
    document.getElementById('btn-mode-reference').classList.contains('active') &&
    !document.getElementById('btn-mode-explore').classList.contains('active');

  tests.push({
    name: "Regression 9: UI mode and MathSystem mode cannot disagree after preset loading (Adversarial A-D)",
    passed: test9Pass,
    details: `caseB=${caseBPass}, caseC=${caseCPass}, caseD=${caseDPass}, directMath=${directMathPass}`
  });

  // =========================================================================
  // TEST GROUP 5: 4K OFFSCREEN IMAGE EXPORT & ZERO CONCURRENT COLLISIONS
  // =========================================================================
  // Monitor render() calls during export to guarantee no collision with animate()
  let renderCallsDuringExport = 0;
  const origRender = renderer.render.bind(renderer);
  renderer.render = function(...args) {
    if (app.isExporting) {
      renderCallsDuringExport++;
    }
    return origRender(...args);
  };

  app.exportPasses = 10; // 10 passes for speed in test suite
  const preExportAccumWidth = renderer.accumWidth;
  const preExportAccumHeight = renderer.accumHeight;
  const preExportFrames = renderer.accumulationFrames;

  let exportBlob = null;
  let exportSuccess = false;
  let exportErr = null;
  app.isExporting = true;

  try {
    exportBlob = await renderer.exportPNG(math, {
      width: 3840,
      height: 2160,
      accumFrames: 10,
      filename: 'test_conradi_4k.png'
    });
    if (exportBlob && exportBlob.size > 10000 && exportBlob.type === 'image/png') {
      exportSuccess = true;
    }
  } catch (err) {
    exportErr = err ? (err.stack || err.message || String(err)) : 'unknown error';
    console.error('Export error in test:', err);
  } finally {
    app.isExporting = false;
  }

  // Restore render spy
  renderer.render = origRender;

  const statePreserved = (
    renderer.accumWidth === preExportAccumWidth &&
    renderer.accumHeight === preExportAccumHeight &&
    renderer.accumulationFrames === preExportFrames
  );

  tests.push({
    name: "Offscreen 4K PNG Export: 3840x2160 Valid Render & Encoding",
    passed: exportSuccess,
    details: exportBlob ? `PNG Blob size: ${(exportBlob.size / (1024 * 1024)).toFixed(2)} MB, type: image/png` : `Export failed with error: ${exportErr}`
  });

  tests.push({
    name: "Offscreen 4K Export: Zero Render Call Collisions During Animation",
    passed: renderCallsDuringExport === 0,
    details: `Concurrent render calls observed: ${renderCallsDuringExport}`
  });

  tests.push({
    name: "Offscreen 4K Export: Session & Interactive State Preserved",
    passed: statePreserved,
    details: `Accum width=${renderer.accumWidth}, height=${renderer.accumHeight}, frames=${renderer.accumulationFrames}`
  });

  // Post results to python server
  fetch('/test_report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(tests)
  });
  document.getElementById('results').innerText = JSON.stringify(tests, null, 2);
  window._testsFinished = true;
}

window.addEventListener('DOMContentLoaded', () => {
  runTests();
});
</script>
