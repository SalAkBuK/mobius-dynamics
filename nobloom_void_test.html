<!DOCTYPE html>
<html><body>
<canvas id='c' width='1200' height='800'></canvas>
<script type='module'>
import { MathSystem } from './math.js';
import { MobiusRenderer } from './renderer.js';

window.onload = async () => {
  const canvas = document.getElementById('c');
  const math = new MathSystem();
  math.setMorphology('lace');
  math.setSymmetry(16);
  math.evolving = false;

  const renderer = new MobiusRenderer(canvas);
  renderer.bloomEnabled = false; // NO BLOOM
  renderer.viewMode = 1;         // Tonemapped accumulation only
  renderer.clearAccumulation();

  // Accumulate 600 frames (10s)
  for (let f = 0; f < 599; f++) {
    math.update(0.016, renderer.zoom);
    renderer.render(math, 0.016);
    await new Promise(r => requestAnimationFrame(r));
  }
  math.update(0.016, renderer.zoom);
  renderer.render(math, 0.016);

  const data10s = canvas.toDataURL('image/png');
  await fetch('/save_nobloom?sec=10', { method: 'POST', body: data10s });

  // Accumulate 600 more frames (20s total)
  for (let f = 0; f < 599; f++) {
    math.update(0.016, renderer.zoom);
    renderer.render(math, 0.016);
    await new Promise(r => requestAnimationFrame(r));
  }
  math.update(0.016, renderer.zoom);
  renderer.render(math, 0.016);

  const data20s = canvas.toDataURL('image/png');
  await fetch('/save_nobloom?sec=20', { method: 'POST', body: data20s });
  await fetch('/finish_nobloom', { method: 'POST' });
};
</script>
</body></html>
