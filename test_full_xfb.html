<!DOCTYPE html>
<html>
<body>
<div id="res">waiting...</div>
<canvas id="c" width="1200" height="800"></canvas>
<script>
window.onload = function() {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false });
  gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('OES_texture_float_linear');

  // Simulation shader with XFB
  const simVs = `#version 300 es
  in vec4 a_state;
  out vec4 v_state;
  uniform vec2 u_a;
  uniform vec2 u_b;
  uniform vec2 u_c;
  uniform vec2 u_d;
  uniform float u_n;
  uniform float u_step;

  uint pcg(uint v) {
    uint state = v * 747796405u + 2891336453u;
    uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
    return (word >> 22u) ^ word;
  }

  float nextRand(inout uint seed) {
    seed = pcg(seed);
    return float(seed & 0x00FFFFFFu) / 16777216.0;
  }

  vec2 c_mul(vec2 x, vec2 y) {
    return vec2(x.x * y.x - x.y * y.y, x.x * y.y + x.y * y.x);
  }

  vec2 c_div(vec2 num, vec2 den) {
    float d = dot(den, den);
    return vec2((num.x * den.x + num.y * den.y) / d, (num.y * den.x - num.x * den.y) / d);
  }

  void main() {
    vec2 z = a_state.xy;
    float age = a_state.z;
    uint seed = uint(a_state.w) + uint(u_step * 1013904223.0);

    int n = int(u_n + 0.5);
    int k = int(nextRand(seed) * float(n)) % n;
    float ang = (6.28318530718 * float(k)) / float(n);
    vec2 omega = vec2(cos(ang), sin(ang));

    vec2 num = c_mul(u_a, z) + u_b;
    vec2 den = c_mul(u_c, z) + u_d;
    if (dot(den, den) < 1e-7 || dot(z, z) > 25.0 || age > 3000.0) {
      float r = 0.22 + nextRand(seed) * 0.40;
      float th = nextRand(seed) * 6.283185;
      z = vec2(r * cos(th), r * sin(th));
      age = 0.0;
    } else {
      z = c_mul(omega, c_div(num, den));
      age += 1.0;
    }
    v_state = vec4(z, age, float(seed & 0x00FFFFFFu));
  }
  `;

  const simFs = `#version 300 es
  precision highp float;
  void main() {}
  `;

  const simV = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(simV, simVs);
  gl.compileShader(simV);
  const simF = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(simF, simFs);
  gl.compileShader(simF);

  const simProg = gl.createProgram();
  gl.attachShader(simProg, simV);
  gl.attachShader(simProg, simF);
  gl.transformFeedbackVaryings(simProg, ['v_state'], gl.SEPARATE_ATTRIBS);
  gl.linkProgram(simProg);

  // Splat shader
  const splatVs = `#version 300 es
  in vec4 a_state;
  uniform vec2 u_viewCenter;
  uniform float u_zoom;
  uniform float u_aspect;
  out float v_discard;

  void main() {
    vec2 z = a_state.xy;
    float age = a_state.z;
    if (age < 20.0 || isnan(z.x) || isnan(z.y) || dot(z, z) > 25.0) {
      v_discard = 1.0;
      gl_Position = vec4(2.0, 2.0, 0.0, 1.0);
      gl_PointSize = 1.0;
      return;
    }
    v_discard = 0.0;
    vec2 clip = (z - u_viewCenter) * u_zoom;
    if (u_aspect > 1.0) {
      clip.x /= u_aspect;
    } else {
      clip.y *= u_aspect;
    }
    gl_Position = vec4(clip, 0.0, 1.0);
    gl_PointSize = 1.2;
  }
  `;

  const splatFs = `#version 300 es
  precision highp float;
  in float v_discard;
  out vec4 o_photon;

  void main() {
    if (v_discard > 0.5) discard;
    vec2 c = gl_PointCoord - vec2(0.5);
    float d2 = dot(c, c);
    if (d2 > 0.25) discard;
    float w = exp(-d2 * 5.0);
    float photon = 0.0006 * w;
    o_photon = vec4(photon, photon * 1.4, photon * 2.2, 1.0);
  }
  `;

  const splatV = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(splatV, splatVs);
  gl.compileShader(splatV);
  const splatF = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(splatF, splatFs);
  gl.compileShader(splatF);

  const splatProg = gl.createProgram();
  gl.attachShader(splatProg, splatV);
  gl.attachShader(splatProg, splatF);
  gl.linkProgram(splatProg);

  // Setup VBOs
  const count = 1048576;
  const data = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    const r = 0.25 + Math.random() * 0.35;
    const th = Math.random() * 6.283185;
    data[i*4+0] = r * Math.cos(th);
    data[i*4+1] = r * Math.sin(th);
    data[i*4+2] = 0;
    data[i*4+3] = (Math.random() * 0xFFFFFF) >>> 0;
  }

  const vbos = [gl.createBuffer(), gl.createBuffer()];
  const vaos = [gl.createVertexArray(), gl.createVertexArray()];
  for (let i = 0; i < 2; i++) {
    gl.bindBuffer(gl.ARRAY_BUFFER, vbos[i]);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STREAM_COPY);
    gl.bindVertexArray(vaos[i]);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
  }

  // Accumulation FBO (1200x800)
  const accumTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, accumTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1200, 800, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  const accumFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, accumFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, accumTex, 0);

  // Run benchmark: 60 frames with 4 steps per frame
  let cur = 0;
  const t0 = performance.now();
  for (let f = 0; f < 60; f++) {
    // 4 simulation steps
    gl.useProgram(simProg);
    gl.uniform2f(gl.getUniformLocation(simProg, 'u_a'), -0.755, 0.33);
    gl.uniform2f(gl.getUniformLocation(simProg, 'u_b'), -0.376, 0.026);
    gl.uniform2f(gl.getUniformLocation(simProg, 'u_c'), 6.401, 0.803);
    gl.uniform2f(gl.getUniformLocation(simProg, 'u_d'), 1.52, 0.84);
    gl.uniform1f(gl.getUniformLocation(simProg, 'u_n'), 12);

    gl.enable(gl.RASTERIZER_DISCARD);
    for (let s = 0; s < 4; s++) {
      gl.uniform1f(gl.getUniformLocation(simProg, 'u_step'), s);
      gl.bindVertexArray(vaos[cur]);
      gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, vbos[1 - cur]);
      gl.beginTransformFeedback(gl.POINTS);
      gl.drawArrays(gl.POINTS, 0, count);
      gl.endTransformFeedback();
      cur = 1 - cur;
    }
    gl.disable(gl.RASTERIZER_DISCARD);

    // Splat into accum FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, accumFbo);
    gl.viewport(0, 0, 1200, 800);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(splatProg);
    gl.uniform2f(gl.getUniformLocation(splatProg, 'u_viewCenter'), 0, 0);
    gl.uniform1f(gl.getUniformLocation(splatProg, 'u_zoom'), 1.65);
    gl.uniform1f(gl.getUniformLocation(splatProg, 'u_aspect'), 1200/800);
    gl.bindVertexArray(vaos[cur]);
    gl.drawArrays(gl.POINTS, 0, count);
    gl.disable(gl.BLEND);
  }
  gl.finish();
  const t1 = performance.now();
  const totalMs = t1 - t0;
  const fps = (60 / (totalMs / 1000)).toFixed(1);
  document.getElementById('res').innerText = 'FULL PIPELINE: 60 frames took ' + totalMs.toFixed(1) + ' ms (' + fps + ' FPS, ' + (totalMs/60).toFixed(2) + ' ms/frame)';
};
</script>
</body>
</html>
